
services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: zorka
      MYSQL_USER: zorka
      MYSQL_PASSWORD: ${ZORKA_DB_PASSWORD:?Set ZORKA_DB_PASSWORD in the environment}
      MYSQL_ROOT_PASSWORD: ${ZORKA_DB_ROOT_PASSWORD:?Set ZORKA_DB_ROOT_PASSWORD in the environment}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  database_data:
